# =============================================================================
# 微服务发布流水线配置
# 可按业务场景定义多条流水线，例如：只发业务服务、只发定时任务、全量发布等。
# 使用方式：python deploy_pipeline.py --pipeline <流水线名> --version <新版本> [--previous-version <旧版本>]
# =============================================================================
# 可配置参数说明：
#
# pipelines.<流水线名>    - 流水线名称，命令行用 --pipeline <名称> 指定
# build_first            - true = 先统一构建所有涉及的镜像，再进入滚动发布阶段（默认）；
#                          false = 不在流水线开头统一构建，各 stage 部署前再顺序构建
# stages[]               - 阶段列表，按顺序执行；某 stage 存在失败时停止后续 stage
#   stages[].name        - 阶段名称（仅用于日志展示）
#   stages[].parallel    - false = 阶段内服务串行发布；true = 阶段内服务可同时发布（要求目标服务器不冲突）
#   stages[].services[]  - 阶段内服务列表，须引用 config/projects.yaml 中已定义的服务键名：
#     name               - 服务名（必填）
#     servers_file       - （可选）该服务专属服务器清单文件，留空则使用默认 config/servers.yaml（或 --env 对应文件）
#     version            - （可选）服务级新版本号，覆盖命令行 --version
#     previous_version   - （可选）服务级回滚版本号，覆盖命令行 --previous-version；首次发版可省略，失败时跳过容器回滚
# =============================================================================
