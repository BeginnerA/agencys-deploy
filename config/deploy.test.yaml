# =============================================================================
# 智能运维平台 —— 测试环境全局配置示例（--env test 时加载 deploy.test.yaml）
# 使用方式：./deploy.sh --project xxx --version 1.0.29 --previous-version 1.0.28 --env test
# =============================================================================
# 可配置参数说明（各段含义与 config/deploy.yaml 完全一致，此处仅列结构）：
#
# 【registry】镜像分发
#   mode      - 分发模式：push = 推送远程仓库（默认）；direct = 本地构建后 scp 直传 docker load
#   namespace - 镜像命名空间：push 模式为仓库项目空间；direct 模式为镜像名前缀（如 xxx/xxx）
#   host      - 镜像仓库地址（仅 push 模式使用）
#   username  - docker login 账号（仅 push 模式），可用环境变量 REGISTRY_USERNAME 覆盖
#   password  - docker login 密码（仅 push 模式），可用环境变量 REGISTRY_PASSWORD 覆盖
#
# 【nacos】服务注册中心
#   url       - Nacos 服务地址
#   namespace - 命名空间 ID，留空表示 public
#   group     - 默认分组（服务在 projects.yaml 未配置 nacos_groups 时使用该分组）
#   username  - 账号，可用环境变量 NACOS_USERNAME 覆盖
#   password  - 密码，可用环境变量 NACOS_PASSWORD 覆盖
#   注意：下方 nacos_groups 为历史遗留字段，当前版本代码未使用；
#         各服务的 Nacos 分组请配置在 config/projects.yaml 的项目级 nacos_groups
#
# 【admin_monitor】Admin 监控平台（预留，当前版本代码未使用）
#   url        - 平台地址，用于确认实例上下线
#   check_path - 实例确认接口路径，留空表示仅人工查看
#
# 【mysql_snailjob】SnailJob 元数据库
#   host     - 数据库地址
#   port     - 数据库端口
#   database - 数据库名
#   username - 账号，可用环境变量 MYSQL_USERNAME 覆盖
#   password - 密码，可用环境变量 MYSQL_PASSWORD 覆盖
#
# 【ssh】服务器连接凭据
#   user     - 登录用户
#   key_file - 私钥路径（未配置密码时使用）
#   password - 密码，可用环境变量 SSH_PASSWORD 覆盖；配置后密码优先、失败自动回退密钥；留空仅用密钥
#   port     - SSH 端口
#
# 【build】本地构建工具链与打包参数
#   maven_home    - Maven 安装目录（留空自动探测：MAVEN_HOME/M2_HOME/PATH → Windows 常见安装位置）
#   java_home     - JDK 安装目录（留空自动探测：JAVA_HOME/PATH → 常见安装位置）
#   maven_profile - Maven 打包 profile（-P 参数），决定 jar 内固化的环境配置；
#                   不配置时自动推导：--env test → -Ptest、--env dev → -Pdev；自定义环境必须显式配置
#
# 【deploy】发布行为
#   project_root        - 本地业务项目源码根目录
#   docker_compose_path - 服务器上 docker-compose.yml 路径
#   health_timeout      - 健康检查总超时（秒）
#   health_interval     - 健康检查轮询间隔（秒）
#   canary_wait         - 首台灰度观察等待时间（秒），0 表示不等待
#   dist_dir            - 直传模式（registry.mode=direct）本地镜像 tar 导出目录（相对本项目目录）
#   remote_tmp_dir      - 直传模式服务器上存放镜像 tar 的临时目录
#   upload_streams      - 直传模式镜像包并行上传通道数（1-8，默认 4）。多通道分片上传
#                         突破单 SSH 通道吞吐上限，高延迟链路提速明显；配 1 回退传统单流
#   image_compress_level - 镜像包 gzip 压缩级别（1-9，默认 6）。调低打包更快、包体略大；
#                         带宽紧张可调高减小传输量
#
# 敏感信息（各账号密码）建议通过环境变量传入，脚本优先读取环境变量：
#   REGISTRY_USERNAME / REGISTRY_PASSWORD / NACOS_USERNAME / NACOS_PASSWORD
#   MYSQL_USERNAME / MYSQL_PASSWORD / SSH_PASSWORD
# =============================================================================
