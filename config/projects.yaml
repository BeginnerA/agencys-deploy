# =============================================================================
# 项目元数据配置（服务清单，新增项目时按相同结构添加即可）
# 服务名（如 xxx）即该项目的键，被 --project 参数与 config/pipelines.yaml 引用
# =============================================================================
# 可配置参数说明：
#
# projects.<服务名>       - 服务键名，须与 docker-compose 服务名、镜像名对应
# deploy_mode            - （可选）发布方式：container（默认）或 static_archive
#                         container      = Docker 镜像 + docker compose 换容器（下述字段必需）
#                         static_archive = 静态 zip 上传 1Panel/nginx 站点目录解压切换（纯静态前端，
#                                          无容器无 Nacos；版本号用日期号 YYYYMMDD[-N] 而非 semver；
#                                          必需 static_dist_dir/site_root，构建类型用 build_type: frontend）
# build_type             - （可选）构建类型：maven（默认）或 frontend
#                         maven    = Java 微服务，走 Maven 多模块构建
#                         frontend = Web 前端项目，走自定义命令（npm/pnpm/yarn 等）
#
# 【Maven 模式】build_order 配置：
# build_order            - Maven 构建顺序，按顺序对每个模块执行 mvn clean {goal} -P{profile}
#   build_order[].name      - 模块名（仅用于日志展示）
#   build_order[].path      - 模块相对路径（相对 deploy.project_root）
#   build_order[].goal      - Maven goal：install / package 等
#   build_order[].extra_profile - （可选）额外 Maven profile，与环境 profile 组合为 -P{env},{extra}；
#                           用于同一仓库按 profile 产出不同 jar 的项目（如 basketball 的 web/job/cli）
#
# 【前端模式】build_order 配置（build_type: frontend 时）：
#   build_order[].name      - 步骤名（仅用于日志展示）
#   build_order[].path      - 工作目录（相对 deploy.project_root）
#   build_order[].commands  - 命令列表，按顺序执行；支持 shell 语法；${VERSION} 会被替换为版本号
#   示例：
#     build_order:
#       - name: "前端构建"
#         path: "mall-web"
#         commands:
#           - "npm install"
#           - "npm run build"
# docker_context         - Dockerfile 所在目录（docker build 上下文）
# dockerfile             - Dockerfile 相对路径
# image_name             - 镜像短名，完整镜像名为 {registry}/{namespace}/{image_name}:{version}
# service_name           - docker-compose.yml 里的服务名
# nacos_groups           - Nacos 分组列表，服务在多个分组下注册时须全部列出（上下线会遍历所有分组）
# dubbo_services         - Dubbo 额外服务名列表（Nacos 里除应用服务名外还可能出现的服务名）
# snailjob_group         - SnailJob group_name，非定时任务项目留空
# health_url             - （可选）专用健康检查 URL，{ip} 会被替换为探测目标 IP；配置后按严格模式检查（须返回 200）
# health_port            - 服务业务端口，用于探活/发布启动判定。监控面板的健康检查经 SSH 在
#                         目标服务器本地对 127.0.0.1:{health_port} 执行（微服务业务端口通常不对
#                         公网放行，从监控机直连必失败），按下述分层退化：
#                         ① 有 health_url → curl 严格（须 200）；② 无 health_url → curl 宽松
#                         （任意 HTTP 响应码即存活）→ /dev/tcp 端口连通兜底；
#                         ③ 无 health_port → 不探测（健康列留空）
# log_error_keywords     - 日志中判定启动失败的错误关键字
# clear_log_dir          - 宿主机应用日志目录（如 1Panel 挂载的 logs 目录）；配置了该路径则在启动新
#                         容器前清空该目录下所有文件（保留目录结构）；省略/留空则不清空（默认）
#
# 镜像版本号（version / previous_version）不在本文件配置，由命令行参数传入：
#   ./deploy.sh --project <服务名> --version <新版本> [--previous-version <旧版本>]
#   --previous-version 可省略（首次发版）；省略时发布失败跳过容器回滚，仅恢复 Nacos 上线
#
# git_repo 字段说明：服务源码所在 Git 仓库路径（相对 deploy.project_root），发布成功后在
# 该仓库打 v{version} tag 并推送远端；多服务共用仓库时填仓库目录名（如 xxx）
# git_branch           - （可选）构建前 checkout 的分支或 tag；留空/省略则不切换，使用当前分支
# git_pull_before_build - （可选）true = 构建前执行 git pull 拉取最新代码；省略/false 则不拉取
#                         与 git_branch 组合使用可确保始终基于远端最新代码构建
#                         Git 操作失败仅告警，不阻断构建流程
# git_tag_enabled      - （可选）发布成功后是否打 Git tag 并推送远端：true（默认）/ false；
#                         关闭后仅本次发布不打 tag，不影响历史 tag；临时不打可不用改这里，
#                         发布面板勾选「本次不打 Git Tag」即可（对应 CLI 参数 --no-git-tag，优先于本配置）
#
# 【静态发布】专属配置（deploy_mode: static_archive 时）：
# site_root              - 站点根目录（必需），1Panel 形态如 /data/1panel/www/sites/example.com/index；
#                         切换采用同父目录两次 rename 原子换入，站点路径本身不变，nginx 无需改动
# backup_dir             - （可选）历代 zip 存放目录，默认 site_root 父目录下的 backup/（即 1Panel 站点
#                         的 backup/ 约定）；每次发布新包自动落此目录作回滚源
# static_dist_dir        - 构建产出目录（相对 deploy.project_root，如 dist/build），打包为 zip 的源
# zip_prefix             - （可选）zip 名前缀（产物 {zip_prefix}-{version}.zip），默认取服务键名；
#                         与现有手动发布习惯对齐时填「达人端」这类中文名即可
# entry_file             - （可选）入口文件名，默认 index.html；解压后据此定位产物根目录（兼容
#                         zip 多包一层目录的形态）
# file_mode              - （可选）换入后文件权限归一值，默认 0644（目录固定 0755，属主 root:root）
# 静态发布示例（前端项目完整配置）：
#   creator-web:
#     deploy_mode: static_archive
#     build_type: frontend
#     build_order:
#       - name: "前端构建"
#         path: "web"
#         commands: ["pnpm install", "pnpm build"]
#     static_dist_dir: "web/dist"
#     site_root: "/data/1panel/www/sites/example.com/index"
#     zip_prefix: "达人端"
#     health_url: "https://example.com/"
# =============================================================================
