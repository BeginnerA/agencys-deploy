# =============================================================================
# 测试环境目标服务器清单示例（--env test 时加载 servers.test.yaml）
# 使用方式：./deploy.sh --project xxx --version 1.0.29 --previous-version 1.0.28 --env test
# =============================================================================
# 可配置参数说明（与 config/servers.yaml 一致）：
#
# servers[].ip       - 服务器 IP（SSH 连接用）
# servers[].role     - 服务器角色：first = 首台（先发布、灰度观察）；follower = 其余服务器
# servers[].nacos_ip - 服务在 Nacos 中注册的内网 IP（NAT 环境下与外网 ip 不同时必须填写）
# servers[].ssh      - （可选）该台服务器的 SSH 覆盖配置，未写的字段继承 deploy.yaml 的 ssh 段；
#                      可覆盖字段：user / password / key_file / port。示例：
#   - ip: "192.168.1.1"
#     role: first
#     ssh:
#       user: "root"
#       password: ""   # 空 = 仅用密钥；填写 = 密码优先、失败回退密钥
# =============================================================================
