# =============================================================================
# Ruff 配置（开发/CI 用，见 requirements-dev.txt）
#
# 选择原则：门禁要拦的是「真缺陷」，不是排版口味。
#   E7/E9  语法层面的可疑写法与硬错误
#   F      pyflakes：未定义名、未使用导入、f-string 空占位等
#   W6     废弃语法
# 刻意不开的风格类规则（E501 行长等）：本仓库注释以中文为主，宽度并非可读性瓶颈，
# 先制造 200+ 条噪声只会让门禁被长期忽略；如需收紧，逐条加规则并一次清完。
# =============================================================================

line-length = 100
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "W6"]

# 允许发布脚本里 `except Exception` 兜底后继续（运维工具的默认要求：单点失败不中断全局）
ignore = []

exclude = [
    ".venv",
    "dist",
    "dist-portable",   # 便携包是构建产物，内含第三方 site-packages
    "build",
    "data",            # 运行时数据（含导出快照），不做源码检查
    "__pycache__",
    "site",            # Qoder Sites 站点副本
]
