# =============================================================================
# pytest 配置
#
# testpaths=tests：仓库根直接执行 `pytest` 只收集本项目用例。
#   否则会把构建产物 dist-portable/ 便携包内 site-packages 自带的第三方测试
#   （如 croniter/tests、certifi/tests）当成本项目用例收集，报
#   ModuleNotFoundError / "import file mismatch" 的假失败，
#   还会向包副本写入 host 版 __pycache__，污染出厂态产物。
# norecursedirs：便携包/虚拟环境/构建产物一律不递归，发布产物目录只读。
# =============================================================================
[pytest]
testpaths = tests
norecursedirs = dist-portable dist build .venv node_modules data .git __pycache__
